name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # ruff lives in the Python dev extra, so the Python env is required
      # (--rust-only is informational and installs nothing).
      - run: ./install.sh --python-only
      - run: ./run.sh format
