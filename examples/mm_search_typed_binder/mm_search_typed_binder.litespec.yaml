          technique: "contract"
          required_layers: ["A1", "A3"]
          hoare_triple:
            sub_part_ref: "seq_part_1"
            command_ref: { function: "LOS_MemSearchBounded", node_id: "L_c_loop::init" }
            pre:  { expression: "pool != null and limit > 0",
                    description: "Init entry" }
            post: { expression: "R_init_done",
                    description: "Init exit: progress = 0" }
            rule:
              rule: "assign"
              premise_refs: []
