            owner_ref: "seq_part_1__seq_part_2"
            kind: "normal_post"
            ref: "R_init_done"
          conclusion_ref: { sub_part: "__parent__", role: "parent" }
        exit_state: null
        control_flow: { members: ["normal"] }
      sub_parts:
        - name: "seq_part_1"
          kind: "seq_segment"
          lir_fragment: { function: "LOS_MemSearchBounded", node_id: "L_c_loop::init" }
          properties:
