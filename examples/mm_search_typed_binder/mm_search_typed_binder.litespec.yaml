# §18.1 Extended Example — `mm_search_typed_binder` (Volume 1, v0.28.3).
# A bounded C-style for-loop with typed binders, desugared by ForCLoweringPass
# (Stage 2) into SequenceExpr([init, WhileExpr(guard, SequenceExpr([body, step]))]).
litespec_version: "0.28.3"

profile:
  name: "litespec-liteos"
  version: "1.0.0"

module:
  name: "kernel_mm"
  display_name: "Kernel Memory Management"
  phase: "lightweight"
  module_type: "kernel"
  source_repo: "https://gitee.com/openharmony/kernel_liteos_m"
  source_commit: "0000000000000000000000000000000000000000"
  extraction_timestamp: "2025-01-01T00:00:00Z"
  extractor: "litespec-extractor"

specs:
  - id: "mm_search_typed_binder"
    title: "Bounded C-style loop with typed binders"
    category: "requirement"
    priority: "high"
    record_phase: "phase_1"
    source:
      file: "kernel/mm/los_memory.c"
      function: "LOS_MemSearchBounded"
      line_range: [220, 260]
      excerpt: |
        void *LOS_MemSearchBounded(void *pool, UINT32 limit) { ... }
      context_note: |
        The C-style for loop at line 230 retains its binder types from
        the source. The cursor binder is `Block`, and the bound binder is
        `Nat`. The `ForCExpr` is retained through Stage 1 and desugared by
        the `ForCLoweringPass` at Stage 2. The desugared form is
        SequenceExpr([init, WhileExpr(guard, SequenceExpr([body, step]))]),
        which contributes two seq-nodes to the top-level path DAG.
        `Block` is declared in LIRSpec.type_declarations.
        global_props is ⊥ per Rule 9.17b.
    contract:
      preconditions:
        - { expression: "pool != null", description: "Pool is non-null" }
        - { expression: "limit > 0", description: "Limit is positive" }
      postconditions:
        - { expression: "cursor = null or cursor.offset <= limit",
            description: "Search terminates within the limit or finds a candidate" }
      invariants: []
      loop_invariants:
        - { family: "shape",    expr: "cursor in free_list or cursor = null", scope: "all" }
        - { family: "boundary", expr: "progress < limit", scope: "all" }
        - { family: "rank",     expr: "limit - progress >= 0", scope: "driver" }
      abi_compatibility:
        entries:
          - name: "LOS_MemSearchBounded"
            return_value_semantics: "NULL indicates no candidate."
            error_codes: ["LOS_ERRNO_MM_NULL"]
            parameter_order: ["pool", "limit"]
            calling_convention: "cdecl"
    state_machine:
      state_variables:
        - { name: "pool",     type: "Nat",         description: "Pool identifier" }
        - { name: "free_list", type: "List<Block>", description: "Free list" }
        - { name: "cursor",   type: "Block",       description: "Search cursor" }
        - { name: "progress", type: "Nat",         description: "Iteration counter" }
      init:
        description: "Initial state"
        expression: "free_list != [] and progress = 0"
      actions:
        - name: "bounded_search"
          trigger: "call"
          guard: "limit > 0"
          effect: |
            for progress:Nat = 0; progress < limit; progress' = progress + 1 do
              cursor' = advance_cursor(cursor)
            od
          context: "thread"
          max_stack_depth: 8
    abstraction:
      relation:
        name: "alpha_search"
        source: "LIR"
        target: "ISIR"
        map_expr: "lambda sigma. { sig_cursor := sigma.cursor }"
        totality: true
      layers: ["A1", "A3"]
      refinement_target:
        isir_id: "mm_search_bounded_isir"
        transition_ref: "tc_search_bounded"
        signal_scope: ["sig_cursor"]
      function_technique: "contract"
    decomposition:
      should_decompose: true
      effective_correctness: "partial"
      exit_state_model:
        enabled: false
        return_targets: []
        break_targets: []
        continue_targets: []
      parent_triple:
