        post: { expression: "cursor = null or cursor.offset <= limit",
                description: "Parent postcondition" }
        rule:
          rule: "seq"
          premise_refs:
            - { sub_part: "seq_part_1", role: "premise" }
            - { sub_part: "seq_part_2", role: "premise" }
          intermediate_ref:
