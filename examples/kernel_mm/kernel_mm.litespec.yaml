# kernel_mm — the LiteOS memory allocator (Phase 1 POC, v0.28.3).
#
# Minimal conformance surface: declares the module + the three in-scope functions
# with their contracts. The full §18.1-style decomposition/state-machine detail is
# elaborated as the spec matures; this document is the §2 conformance target.
litespec_version: "0.28.3"

profile:
  name: "litespec-liteos"
  version: "1.0.0"

module:
  name: "kernel_mm"
  display_name: "Kernel Memory Management"
  phase: "lightweight"
  module_type: "kernel"
  source_repo: "https://gitee.com/openharmony/kernel_liteos_a"
  source_commit: "1b5d3de13bea4a93e6713f180710f2f307cad403"
  extraction_timestamp: "2025-01-01T00:00:00Z"
  extractor: "litespec-extractor"

specs:
  - id: "mm_alloc_001"
    title: "LOS_MemAlloc — allocate a block from the memory pool"
    category: "requirement"
    priority: "high"
    record_phase: "phase_1"
    source:
      file: "kernel/base/mem/tlsf/los_memory.c"
      function: "LOS_MemAlloc"
    contract:
      preconditions:
        - { expression: "pool != null", description: "Pool is non-null" }
        - { expression: "size > 0", description: "Size is positive" }
      postconditions:
        - { expression: "result != null", description: "Allocation returns a valid block" }
      invariants: []

  - id: "mm_free_001"
    title: "LOS_MemFree — return a block to the memory pool"
    category: "requirement"
    priority: "high"
    record_phase: "phase_1"
    source:
      file: "kernel/base/mem/tlsf/los_memory.c"
      function: "LOS_MemFree"
    contract:
      preconditions:
        - { expression: "pool != null", description: "Pool is non-null" }
        - { expression: "ptr != null", description: "Pointer is non-null" }
      postconditions:
        - { expression: "result == 0", description: "Free succeeds (LOS_OK)" }
      invariants: []

  - id: "mm_alloc_aligned_001"
    title: "LOS_MemAllocAlign — allocate an aligned block from the memory pool"
    category: "requirement"
    priority: "high"
    record_phase: "phase_1"
    source:
      file: "kernel/base/mem/tlsf/los_memory.c"
      function: "LOS_MemAllocAlign"
    contract:
      preconditions:
        - { expression: "pool != null", description: "Pool is non-null" }
        - { expression: "boundary > 0", description: "Alignment is positive" }
      postconditions:
        - { expression: "result != null", description: "Allocation returns an aligned block" }
      invariants: []
