[project]
name = "litespec"
version = "0.28.3"
description = "LiteSpec: a unified specification and lowering framework (C -> LIR -> Rust) with ISIR/InterScope integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LiteSpec contributors" }]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "lark>=1.1",
    "tree-sitter>=0.21",
    "tree-sitter-c>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.9",
    "mypy>=1.8",
    "hypothesis>=6.90",
]

[project.scripts]
litespec = "litespec.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litespec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    "UP045",  # Optional[X] vs X | None (readability choice)
    "UP007",  # Union[X, Y] vs X | Y
    "UP035",  # typing.Optional import style
    "RUF012", # mutable class defaults are handled by Pydantic
    "PLW1510", # subprocess without check (handled explicitly in tests)
    "SIM102", # collapsible-if (style)
    "SIM101", # multiple isinstance (readability)
    "TRY004", # ValueError for precondition violation is intentional
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-export modules

[tool.mypy]
python_version = "3.11"
mypy_path = "src"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
